<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Downloader</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
        }
        .app-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }
        .app-icon {
            width: 36px;
            height: 36px;
            background-color: #0076ff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 2px 6px rgba(0, 118, 255, 0.3);
        }
        h2 {
            margin: 0;
            font-size: 22px;
            color: #111;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fafafa;
        }
        textarea {
            resize: vertical;
            min-height: 150px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #0076ff;
            background-color: #fff;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #0076ff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #005ecb;
        }
        
        .github-footer {
            display: flex;
            justify-content: center;
            border-top: 1px solid #f0f0f0;
            padding-top: 20px;
        }
        .github-btn {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: #ffffff;
            background-color: #24292e;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .github-btn:hover {
            background-color: #1b1f23;
        }
        .github-btn svg {
            margin-right: 8px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="app-header">
            <div class="app-icon">&darr;</div>
            <h2>File Downloader</h2>
        </div>
        
        <div class="input-group">
            <label for="fileNameInput">File Name & Extension</label>
            <input type="text" id="fileNameInput" value="document.txt" placeholder="e.g., project.html, data.json">
        </div>
        
        <div class="input-group">
            <label for="textInput">File Content</label>
            <textarea id="textInput" placeholder="Type or paste your text content here..."></textarea>
        </div>
        
        <button id="downloadBtn">Download File</button>
        
        <div class="github-footer">
            <a class="github-btn" href="https://github.com/xchanroldan101/Text-Downloader" target="_blank">
                <svg height="20" width="20" viewBox="0 0 16 16">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                </svg>
                GitHub
            </a>
        </div>
    </div>

    <script>
    document.getElementById('downloadBtn').addEventListener('click', function () {
        const textContent = document.getElementById('textInput').value;
        let fullFileName = document.getElementById('fileNameInput').value.trim();
        
        if (fullFileName === "") {
            fullFileName = "document.txt";
        }
        
        if (!fullFileName.includes('.')) {
            fullFileName += '.txt';
        }
        
        const extension = fullFileName.substring(fullFileName.lastIndexOf('.')).toLowerCase();
        let mimeType = 'text/plain'; 
        if (extension === '.html' || extension === '.htm') mimeType = 'text/html';
        else if (extension === '.css') mimeType = 'text/css';
        else if (extension === '.json') mimeType = 'application/json';
        else if (extension === '.js') mimeType = 'application/javascript';
        else if (extension === '.csv') mimeType = 'text/csv';
        else if (extension === '.xml') mimeType = 'application/xml';
        else if (extension === '.md' || extension === '.markdown') mimeType = 'text/markdown';
        
        const blob = new Blob([textContent], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fullFileName; 
        
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });
    </script>

</body>
</html>
